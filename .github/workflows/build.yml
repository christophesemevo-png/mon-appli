name: Construire l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Préparer la partie Android
        run: flutter create . --platforms=android --project-name mon_appli --org com.monappli

      - name: Installer les composants
        run: flutter pub get

      - name: Corriger la version Android des composants
        run: |
          find $HOME/.pub-cache/hosted -path "*/android/build.gradle*" -exec sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 36/' {} +

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-appli-apk
          path: build/app/outputs/flutter-apk/app-release.apk
